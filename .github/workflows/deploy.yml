name: Build with Docker and Deploy to cPanel via FTP
 
on:
  push:
    branches:
      - main
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build Docker Image
        run: |
          docker build -t my-app .
 
      - name: Extract Build Files from Docker
        run: |
          docker create --name temp_container my-app
          docker cp temp_container:/var/www/html ./build_output
          docker rm temp_container
 
      - name: Clean unwanted folders from build_output
        run: |
          rm -rf ./build_output/vendor
          rm -rf ./build_output/vendor_old
          rm -rf ./build_output/system
          rm -rf ./build_output/node_modules
          rm -rf ./build_output/storage
          rm -rf ./build_output/public/upload
          rm -rf ./build_output/public/uploads
          rm -rf ./build_output/public/storage
          rm -rf ./build_output/public/assets/img/
          rm -rf ./build_output/.git
          rm -f ./build_output/.gitignore
          rm -f ./build_output/.gitattributes
 
      - name: Debug secrets (for troubleshooting only, remove in production)
        run: |
          echo "Host: ${{ secrets.FTP_HOST }}"
          echo "Username: ${{ secrets.FTP_USERNAME }}"
          echo "Password is set: ${{ secrets.FTP_PASSWORD != '' }}"
 
      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 72.60.216.54
          username: 'u573967329.hotelerpftp'
          password: 'O*0lg6qC8s'
          server-dir: /
          local-dir: ./build_output/
          protocol: ftps
          port: 21
          timeout: 60000
          exclude: |
            **/.git*
            **/.env
            **/vendor/**
            **/RajInfra/**
            **/inventory-billing/**
            **/vendor_old/**
            **/system/**
            **/node_modules/**
            **/storage/**
            **/public/upload/**
            **/public/uploads/**
            **/public/storage/**
            **/public/assets/img/**
            **/app/Config/App.php
            **/app/Config/Database.php
            **/app/Config/Email.php
            **/app/Config/Paths.php
            **/app/Config/Encryption.php
            **/app/Config/Logger.php